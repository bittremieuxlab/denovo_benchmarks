services:
  denovo-benchmarks-streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bittremieuxlab/denovo-benchmarks-streamlit-app:latest
    restart: unless-stopped

    # No host port is published: the reverse proxy reaches the container over
    # the shared bittremieuxlab-public network.
    expose:
      - "8501"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    # Port and bind address are set by the Dockerfile's ENTRYPOINT flags, which
    # take precedence over STREAMLIT_* environment variables.
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      TZ: Europe/Brussels

    labels:
      web-service-type: web-projects

    networks:
      - bittremieuxlab-public

networks:
  bittremieuxlab-public:
    external: true
